<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="false">🌙</button>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="fx-layer" class="fx-layer" aria-live="polite"></div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">MODE</span>
          <span class="value mode-value" id="mode-label">—</span>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section combo-b2b">
          <div>
            <span class="label">COMBO</span>
            <span class="value combo-value" id="combo">—</span>
          </div>
          <div>
            <span class="label">B2B</span>
            <span class="value combo-value" id="b2b">—</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="powerup-value" id="powerup-next">—</span>
          <span class="powerup-status" id="powerup-status"></span>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <!-- Opciones generadas en game.js a partir de SKINS (skins.js), para
               no mantener una segunda lista de skins duplicada aquí. -->
          <select id="skin-select"></select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="mode-menu" class="mode-menu hidden">
          <button type="button" class="mode-btn" data-mode="classic"><kbd>1</kbd> Clásico</button>
          <button type="button" class="mode-btn" data-mode="classicPower"><kbd>2</kbd> Clásico + Power-ups</button>
          <button type="button" class="mode-btn" data-mode="extended"><kbd>3</kbd> Extendido</button>
        </div>
        <button id="restart-btn" class="hidden">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="scoring.js"></script>
  <script src="effects.js"></script>
  <script src="skins.js"></script>
  <script src="game.js"></script>
</body>
</html>
